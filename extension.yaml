id: jcode.pack.android
name: Android Dev Pack
publisher: jcode
version: 0.8.0
type: language
description: Android XML + Gradle language support, a layout designer, the virtual device, and an Android app template.

# A combined Android dev pack. Kotlin coloring/completion/formatting come from the
# required Kotlin Dev Pack (jcode.lang.kotlin); this pack adds Android XML +
# Gradle languages and declares an Android app project template.
# The device reads its own `defaultDeviceScreen` setting through the extension API, and every family
# on that API is gated on being declared here — an undeclared `config` is refused with "capability
# 'config' is not declared", which is a silent empty map on the reading side.
api:
  minApiVersion: 1
  # `exec` is the Android SDK Manager's: `sdkmanager` is a real program in the Linux runtime and
  # the only way to ask it what is installed, or to install anything, is to run it. It appears on
  # the Permissions screen as "Run commands in the Linux runtime", which is exactly what it is.
  capabilities: [config, exec]

requires:
  # The Kotlin Dev Pack requires the Kotlin LSP itself, so Android gets it transitively. The Java
  # pack is here because Android is a JVM platform before it is a Kotlin one: the manifest, the
  # Gradle plugin's own sources and most of what a decompiler or a stack trace shows are Java, and
  # the pack also brings the JVM debug adapter this pack's debugging depends on.
  extensions: [jcode.lang.kotlin, jcode.lang.java]
  # adb is the distro's native aarch64 client, and it is a requirement rather than a suggestion now
  # that this pack OWNS the virtual device. The device answers an adb daemon JCode binds in its own
  # storage, and that daemon is reachable from a terminal, from `./gradlew installDebug` and from
  # `flutter run` only through this client -- Google's platform-tools ship an x86_64-only adb that
  # cannot execute here. Without it the device still runs, and half of what makes it a *device* is
  # unreachable.
  sdks: [adb]
suggests:
  sdks: [android-sdk]
  dbg: [java-debug]

# Build helpers, so a project that was cloned rather than scaffolded here is one tap from an APK.
#
# All of them are `kind: build`, which puts them in the Run panel's Build segment: each produces an
# artifact (or a report) and exits, rather than starting something to interact with. None launch the
# app, deliberately. J Code detects a Gradle project's Android application modules itself and offers
# "Run on a device" and "Run in a virtual device" per module, and extension presets share that one
# list — a launch preset here would sit beside them as a duplicate, and could not be a correct one
# either: the virtual-device recipe is found afterwards by a project-RELATIVE marker in its script,
# while a preset's substitutions ({{projectDir}}, {{file}}/{{dir}}, {{fileN}}/{{dirN}}) all expand to
# guest-absolute paths. The build tasks have neither problem, and {{projectDir}} is all they need.
contributes:
  # The Android SDK has a package manager of its own, and one "Android SDK · Installed" row in
  # the Toolchains list can say nothing about what is inside it — which platforms are here, which
  # are only half here, what revision each is at, and which of them this device could not build
  # against even once installed. So this pack puts its own manager in that list, and draws it.
  toolchainActions:
    - id: sdkmanager
      label: Android SDK Manager
      icon: android
  runConfigPresets:
    - android-doctor
    - android-doctor-fix
    - android-assemble-release
    - android-bundle-release
    - android-install-debug
    - android-unit-tests
    - android-lint
    - android-clean
templates:
  - android-app

languages:
  - android-xml
  - gradle
# --- header fields merged from extension.jehm ---
shortDescription: >-
  Android XML + Gradle language support, helpers, and an Android app project template (Kotlin features via the Kotlin
  Dev Pack).
# 1.7.0 is where the virtual device stopped being part of JCode and became this pack's. An older
# JCode has its own device built in, does not implement extension API 8, and has no `:guest` stub to
# load this pack's container into — so installing this there would replace a working device with
# nothing. The floor is what refuses that.
minJCodeVersion: 1.7.0
targetJCodeVersion: 1.7.0
category: Languages
subcategory: Android
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
settings:
  - key: defaultDeviceScreen
    label: Default vDevice screen size
    type: enum
    default: fit
    options: [fit, phone, phone-small, foldable, tablet]
    description: >-
      Which screen the virtual device pretends to be when it opens. `fit` is the tab's own shape,
      which is what the device did before there was anything to choose; the rest are real screens —
      picking one rewrites the guest's DisplayMetrics and Configuration, so its resource qualifiers
      reselect and an app laid out for a small phone genuinely reflows. The device's own control bar
      switches between them for the session; this is where the session starts.

  - key: deviceSurface
    label: Where the virtual device opens
    type: enum
    default: tab
    options: [tab, drawer]
    description: >-
      An editor tab, or the right drawer beside the editor. The drawer keeps the device on screen
      while you work in a file, which is what watching an app react to a change actually looks like;
      a tab gives it the whole width, which is what a tablet profile wants. Only ever one of the two
      — the device is a real embedded surface with one guest behind it, so JCode moves it rather than
      drawing it twice.

  - key: openLayoutsInDesigner
    label: Open layouts in the designer
    type: boolean
    default: "true"
    description: >-
      Opening a file from res/layout shows the visual designer instead of the XML. Turn this off to
      open layouts as text; the < > and Preview toggles still switch between the two either way.

entry:
  manifest: extension.yaml
  ui: null
  libs: []
  # The pack's native half: three archives, one per surface. Loaded on demand into JCode's own
  # process -- see native/ for what they are and NativeExtensionLoader for how they get in.
  #
  # A list, not one entry. They were one archive until JCode's entry.native became a list, and it
  # cost more than it looked: the `:guest` process loaded the designer and the SDK manager to reach
  # the container, ConstraintLayout rode along for all three though only the designer inflates it,
  # and `minSdk 33` was imposed by the container on two modules that do not need it.
  native:
    # Its own library, its own dex, its own `res/` and `assets/` -- empty today, which is why the
    # archive is mostly classes. An archive rather than a loose dex so that owning a drawable later
    # is a file, not a packaging change.
    #
    # It declares no `views`; it is reached by its file claims.
    - id: designer
      apk: lib/designer.apk
      class: dev.jcode.ext.android.designer.DesignerExtension
      abi: 9
      claims:
        # A layout is decided by where it lives: AndroidManifest.xml is also XML and is not a layout.
        #
        # `opensInPreview` names the setting that governs it: a layout file *is* a layout before it is
        # XML, so opening it as text and making the user find a menu is the wrong way round. Only this
        # claim declares it -- a Kotlin file is not primarily a composable, and a Dart or JSX file is
        # mostly not UI at all.
        - fileTypes: [xml]
          pathContains: res/layout
          opensInPreview: openLayoutsInDesigner
          label: Show Designer
          icon: image
        # A composable cannot be told from any other Kotlin file by its path, so ask the file.
        - fileTypes: [kt]
          contains: "@Composable"
          label: Show Designer
          icon: image
        # Flutter and React Native, drawn as an approximation and labelled as one: there is no Dart
        # or JS runtime in JCode's process, so the canvas shows structure rather than a guess at
        # pixels. Both are decided by content for the same reason Kotlin is.
        - fileTypes: [dart]
          contains: "Widget build("
          label: Show Designer
          icon: image
        - fileTypes: [jsx, tsx]
          contains: "return"
          label: Show Designer
          icon: image
    # The same shape: a table drawn entirely from JCode's own design system owns no drawable, no
    # string and no id of its own today, and can own all three without anyone touching this file.
    #
    # Its `views` id is the same string as its contributes.toolchainActions id -- the workbench opens
    # a contributed action by asking for the view named after it.
    - id: sdkmanager
      apk: lib/sdkmanager.apk
      class: dev.jcode.ext.android.sdkmanager.SdkManagerExtension
      abi: 9
      views: [sdkmanager]
    # An APK, and the only one that has to be. The status bar, quick-settings icons and permission
    # prompt are real drawables, the ids its views carry are what `uiautomator dump` reports and an
    # agent addresses, and the device's own system apps ride along as ~700 KB of assets. A dex
    # carries none of that, and `addAssetPath` needs an archive to attach.
    #
    # `guest` is loaded into the `:guest` process by JCode's GuestSessionService stub, which owns
    # that process because `android:process` can only be declared in a manifest. Declaring it is also
    # how JCode knows this pack provides the virtual device at all -- and now which archive to load
    # for it, which is the whole reason that process stopped carrying the other two.
    - id: vdevice
      apk: lib/vdevice.apk
      class: dev.jcode.ext.android.vdevice.VirtualDeviceExtension
      guest: dev.jcode.ext.android.vdevice.VirtualDeviceGuest
      abi: 9
      views: [device, hardware]
