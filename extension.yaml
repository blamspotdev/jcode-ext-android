id: jcode.pack.android
name: Android Dev Pack
publisher: jcode
version: 0.6.0
type: language
description: Android XML + Gradle language support, helpers, and an Android app template.

# A combined Android dev pack. Kotlin coloring/completion/formatting come from the
# required Kotlin Dev Pack (jcode.lang.kotlin); this pack adds Android XML +
# Gradle languages and declares an Android app project template.
requires:
  # The Kotlin Dev Pack requires the Kotlin LSP itself, so Android gets it transitively.
  extensions: [jcode.lang.kotlin]
suggests:
  # adb is the distro's native aarch64 client. The device sandbox itself needs nothing
  # installed, but J Code's own adbd is only reachable from a terminal through it.
  sdks: [android-sdk, adb]
  dbg: [java-debug]

# Build helpers, so a project that was cloned rather than scaffolded here is one tap from an APK.
#
# All of them are `kind: build`, which puts them in the Run panel's Build segment: each produces an
# artifact (or a report) and exits, rather than starting something to interact with. None launch the
# app, deliberately. J Code detects a Gradle project's Android application modules itself and offers
# "Run on a device" and "Run in a virtual device" per module, and extension presets share that one
# list — a launch preset here would sit beside them as a duplicate, and could not be a correct one
# either: the virtual-device recipe is found afterwards by a project-RELATIVE marker in its script,
# while a preset's substitutions ({{projectDir}}, {{file}}/{{dir}}, {{fileN}}/{{dirN}}) all expand to
# guest-absolute paths. The build tasks have neither problem, and {{projectDir}} is all they need.
contributes:
  runConfigPresets:
    # --- the two that make a CLONED project buildable at all -----------------
    #
    # A repository written on a desktop assumes a desktop SDK: a compileSdk newer than the ARM-native
    # aapt2 here can read, an sdk.dir from another machine, a wrapper jar that was gitignored. None of
    # that announces itself — the build just fails deep inside resource linking — so the check names
    # each one, and the fix repairs the three that can be repaired locally.
    - id: android-doctor
      label: Check this project builds here
      kind: build
      requires: [gradlew]
      terminals:
        - label: Check
          command: |
            # Reports only. Nothing here writes to the project; "Apply build fixes" does that.
            PROJ="{{projectDir}}"
            cd "$PROJ" || { echo "Cannot enter $PROJ"; exit 1; }
            FAIL=0
            note() { printf '      %s\n' "$*"; }
            bad()  { printf '  [!] %s\n' "$*"; FAIL=$((FAIL + 1)); }
            ok()   { printf '  [ok] %s\n' "$*"; }
            # Never look inside build output, Gradle's caches, or J Code's own directory: the fixer
            # backs originals up under .jcode, and a scan that read those back would report a project
            # as broken because of a copy of how it used to be.
            SKIP="--exclude-dir=build --exclude-dir=.gradle --exclude-dir=.jcode --exclude-dir=.git"
            SCRIPTS=$(grep -rl $SKIP -E 'compileSdk|targetSdk' --include='build.gradle' --include='build.gradle.kts' --include='libs.versions.toml' . 2>/dev/null)

            echo "== Can this device build $PROJ? =="

            echo "- Android SDK"
            SDK="${ANDROID_HOME:-}"
            [ -n "$SDK" ] || SDK="${ANDROID_SDK_ROOT:-}"
            CEILING=""
            if [ -z "$SDK" ] || [ ! -d "$SDK/platforms" ]; then
              bad "No Android SDK. Install the 'android-sdk' toolchain from the Toolchains panel."
            else
              ok "ANDROID_HOME=$SDK"
              CEILING=$(tr -dc '0-9' < "$SDK/jcode-compile-sdk.txt" 2>/dev/null)
              if [ -n "$CEILING" ]; then
                ok "Highest compileSdk this device's aapt2 can link against: $CEILING"
              else
                note "No jcode-compile-sdk.txt; reinstall the android-sdk toolchain to record the ceiling."
              fi
            fi

            echo "- compileSdk"
            MAX=""
            [ -n "$SCRIPTS" ] && MAX=$(sed -n -E 's/.*compileSdk[A-Za-z]*[[:space:]]*=?[[:space:]]*"?([0-9]+)"?.*/\1/p' $SCRIPTS 2>/dev/null | sort -n | tail -1)
            if [ -z "$MAX" ]; then
              note "No numeric compileSdk found in any build script or version catalog."
            elif [ -n "$CEILING" ] && [ "$MAX" -gt "$CEILING" ]; then
              bad "compileSdk $MAX is above this device's ceiling of $CEILING; resource linking fails with 'RES_TABLE_TYPE_TYPE entry offsets overlap actual entry data'."
              grep -n -E 'compileSdk[A-Za-z]*[[:space:]]*=?[[:space:]]*"?[0-9]+' $SCRIPTS 2>/dev/null | sed 's/^/      /'
            else
              ok "compileSdk $MAX"
            fi

            echo "- Gradle wrapper"
            if [ ! -f gradlew ]; then
              bad "No ./gradlew here. Create one with: gradle wrapper --gradle-version 8.9"
            elif [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              bad "gradle/wrapper/gradle-wrapper.jar is missing (often gitignored), so ./gradlew cannot start. Restore it with: gradle wrapper"
            else
              WRAP=$(sed -n -E 's/^distributionUrl=.*gradle-([0-9.]+)-(bin|all)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties 2>/dev/null)
              ok "Wrapper Gradle ${WRAP:-(version not readable)}"
            fi

            echo "- local.properties"
            if [ ! -f local.properties ]; then
              ok "Absent, so ANDROID_HOME is what the build uses."
            else
              DIR=$(sed -n -E 's/^[[:space:]]*sdk\.dir=(.*)$/\1/p' local.properties | tail -1 | tr -d '\r')
              if [ -z "$DIR" ]; then
                ok "No sdk.dir line, so ANDROID_HOME is what the build uses."
              elif [ -d "$DIR" ]; then
                ok "sdk.dir=$DIR"
              else
                bad "sdk.dir=$DIR does not exist here; it was committed from another machine."
              fi
            fi

            echo "- aapt2"
            GP="$HOME/.gradle/gradle.properties"
            if grep -qs '^android.aapt2FromMavenOverride=' "$GP"; then
              ok "$(grep -h '^android.aapt2FromMavenOverride=' "$GP" | tail -1)"
            else
              bad "android.aapt2FromMavenOverride is unset in $GP, so AGP fetches its own x86_64 aapt2 and the build dies with 'AAPT2 ... Daemon startup failed'. Reinstalling the android-sdk toolchain writes it."
            fi
            if grep -qs '^android.aapt2FromMavenOverride=' gradle.properties; then
              note "This project sets it too, and a project property wins:"
              grep -h '^android.aapt2FromMavenOverride=' gradle.properties | sed 's/^/      /'
            fi

            echo "- Memory"
            ARGS=$(grep -hs '^org.gradle.jvmargs' gradle.properties | tail -1)
            RAM=$(awk '/MemTotal/ { printf "%d", $2 / 1024 }' /proc/meminfo 2>/dev/null)
            if [ -n "$ARGS" ]; then
              note "$ARGS"
              [ -n "$RAM" ] && note "This device has ${RAM} MB of RAM. A heap much past a third of that will thrash rather than build."
            else
              ok "No org.gradle.jvmargs, so Gradle picks its own heap."
            fi

            echo "- Toolchain"
            java -version 2>&1 | head -1 | sed 's/^/      /'
            if grep -rqs $SKIP 'externalNativeBuild' --include='build.gradle' --include='build.gradle.kts' . ; then
              note "This project compiles native code, so it needs the NDK and CMake as well as the SDK."
            fi

            echo
            if [ "$FAIL" -eq 0 ]; then
              echo "Nothing blocking. Build it from the Build segment, or: ./gradlew assembleDebug"
            else
              echo "$FAIL blocker(s). 'Apply build fixes' repairs the local ones and backs up every file it edits."
            fi

    - id: android-doctor-fix
      label: Apply build fixes
      kind: build
      requires: [gradlew]
      terminals:
        - label: Fix
          command: |
            # Writes to the project. Every edited file is copied into .jcode/build-fix-backup-<stamp>/
            # first, and the run prints each change, so `git diff` afterwards is the whole story.
            PROJ="{{projectDir}}"
            cd "$PROJ" || { echo "Cannot enter $PROJ"; exit 1; }
            SDK="${ANDROID_HOME:-}"
            [ -n "$SDK" ] || SDK="${ANDROID_SDK_ROOT:-}"
            if [ -z "$SDK" ] || [ ! -d "$SDK/platforms" ]; then
              echo "No Android SDK. Install the 'android-sdk' toolchain first; nothing to fix without it."
              exit 1
            fi
            CEILING=$(tr -dc '0-9' < "$SDK/jcode-compile-sdk.txt" 2>/dev/null)
            BK=".jcode/build-fix-backup-$(date +%Y%m%d-%H%M%S)"
            CHANGED=0
            backup() { mkdir -p "$BK/$(dirname "$1")" && cp -p "$1" "$BK/$1"; }
            # Backups live under .jcode, so the scan below must skip it: a second run would otherwise
            # rewrite the copies of what the first run changed, and there would be no original left.
            SKIP="--exclude-dir=build --exclude-dir=.gradle --exclude-dir=.jcode --exclude-dir=.git"

            echo "== Applying build fixes in $PROJ =="

            # 1. Point the build at this device's SDK. Gradle reads local.properties before it reads
            #    the environment, so a stale sdk.dir from another machine beats a correct ANDROID_HOME.
            NEED_LOCAL=0
            if [ ! -f local.properties ]; then
              NEED_LOCAL=1
            else
              DIR=$(sed -n -E 's/^[[:space:]]*sdk\.dir=(.*)$/\1/p' local.properties | tail -1 | tr -d '\r')
              [ -n "$DIR" ] && [ ! -d "$DIR" ] && NEED_LOCAL=1
            fi
            if [ "$NEED_LOCAL" -eq 1 ]; then
              [ -f local.properties ] && backup local.properties
              [ -f local.properties ] && sed -i '/^[[:space:]]*sdk\.dir=/d' local.properties
              printf 'sdk.dir=%s\n' "$SDK" >> local.properties
              echo "  local.properties: sdk.dir=$SDK"
              CHANGED=$((CHANGED + 1))
            fi

            # 2. Pin compileSdk/targetSdk down to what the ARM-native aapt2 can read. Only values ABOVE
            #    the ceiling are touched; a project already on an older SDK is left where it is.
            if [ -n "$CEILING" ]; then
              SCRIPTS=$(grep -rl $SKIP -E 'compileSdk|targetSdk' --include='build.gradle' --include='build.gradle.kts' --include='libs.versions.toml' . 2>/dev/null)
              for f in $SCRIPTS; do
                SAVED=0
                for key in compileSdk targetSdk; do
                  for n in $(sed -n -E "s/.*$key"'[A-Za-z]*[[:space:]]*=?[[:space:]]*"?([0-9]+)"?.*/\1/p' "$f" | sort -un); do
                    [ "$n" -gt "$CEILING" ] || continue
                    [ "$SAVED" -eq 1 ] || { backup "$f"; SAVED=1; }
                    sed -i -E "s/($key"'[A-Za-z]*[[:space:]]*=?[[:space:]]*"?)'"$n"'("?)/\1'"$CEILING"'\2/g' "$f"
                    echo "  $f: $key $n -> $CEILING"
                    CHANGED=$((CHANGED + 1))
                  done
                done
              done
            else
              echo "  (compileSdk left alone: the SDK recorded no ceiling; reinstall the android-sdk toolchain.)"
            fi

            # 3. A wrapper checked out without its exec bit. J Code runs `bash gradlew` so this is not
            #    what breaks it here, but everything else that shells out to ./gradlew wants it.
            if [ -f gradlew ] && [ ! -x gradlew ]; then
              chmod +x gradlew && echo "  gradlew: made executable" && CHANGED=$((CHANGED + 1))
            fi

            echo
            if [ "$CHANGED" -eq 0 ]; then
              rmdir "$BK" 2>/dev/null
              echo "Nothing to change. Run 'Check this project builds here' for what is left."
            else
              echo "$CHANGED change(s). Originals are in $BK. Review with 'git diff' before committing."
            fi
            if [ -f gradlew ] && [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Still manual: gradle/wrapper/gradle-wrapper.jar is missing. Restore it with: gradle wrapper"
            fi

    # --- the everyday Gradle tasks -------------------------------------------
    #
    # `gradlew` rather than a build script: it is the one file every Gradle project has under either
    # DSL, and it is what each of these invokes. J Code's own detection covers assembleDebug, so these
    # start where it stops.
    - id: android-assemble-release
      label: Assemble release APK
      kind: build
      requires: [gradlew]
      terminals:
        - label: Build
          command: cd {{projectDir}} && ./gradlew assembleRelease

    - id: android-bundle-release
      label: Bundle release AAB
      kind: build
      requires: [gradlew]
      terminals:
        - label: Build
          command: cd {{projectDir}} && ./gradlew bundleRelease

    - id: android-install-debug
      label: Install debug build on the selected device
      kind: build
      requires: [gradlew]
      terminals:
        - label: Install
          command: cd {{projectDir}} && ./gradlew installDebug

    - id: android-unit-tests
      label: Run unit tests
      kind: build
      requires: [gradlew]
      terminals:
        - label: Test
          command: cd {{projectDir}} && ./gradlew testDebugUnitTest

    - id: android-lint
      label: Run lint
      kind: build
      requires: [gradlew]
      terminals:
        - label: Lint
          command: cd {{projectDir}} && ./gradlew lintDebug

    - id: android-clean
      label: Clean build outputs
      kind: build
      requires: [gradlew]
      terminals:
        - label: Clean
          command: cd {{projectDir}} && ./gradlew clean

templates:
  - android-app

languages:
  # ---------------------------------------------------------------- Android XML
  - id: android-xml
    extensions: [".xml"]
    comment: { blockStart: "<!--", blockEnd: "-->" }
    strings: ["\"", "'"]
    keywords: [
      LinearLayout, ConstraintLayout, FrameLayout, RelativeLayout, TextView, Button,
      EditText, ImageView, RecyclerView, ScrollView,
      "androidx.constraintlayout.widget.ConstraintLayout",
      manifest, application, activity, "uses-permission", "intent-filter", action,
      category, provider, service, receiver,
      "android:layout_width", "android:layout_height", "android:id", "android:text",
      "android:orientation", "android:gravity", "android:padding",
      "android:layout_margin", "android:background", "android:textSize",
      "android:textColor", "android:src", "android:visibility", "android:onClick"
    ]
    types: [
      match_parent, wrap_content, fill_parent, "true", "false", vertical, horizontal,
      center, center_vertical, center_horizontal, start, end, top, bottom, left, right,
      visible, invisible, gone, "@+id", "@id", "@string", "@drawable", "@color",
      "@dimen", "@style", "@mipmap", "@android:id", parent
    ]
    formatter: { indent: 4, trimTrailingWhitespace: true, insertFinalNewline: true }
    completions:
      - { label: textview, detail: TextView, insert: "<TextView\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"$0\" />" }
      - { label: button, detail: Button, insert: "<Button\n    android:id=\"@+id/$1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"$0\" />" }
      - { label: constraint, detail: ConstraintLayout block, insert: "<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\">\n    $0\n</androidx.constraintlayout.widget.ConstraintLayout>" }
      - { label: matchparent, detail: match_parent size, insert: "android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"$0" }
      - { label: activity, detail: manifest <activity>, insert: "<activity\n    android:name=\".$1\"\n    android:exported=\"$2\">\n    $0\n</activity>" }
      - { label: permission, detail: uses-permission, insert: "<uses-permission android:name=\"android.permission.$0\" />" }
    helpers:
      - title: activity_main.xml (ConstraintLayout)
        snippet: |
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <TextView
                  android:id="@+id/message"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="$0"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

          </androidx.constraintlayout.widget.ConstraintLayout>
      - title: AndroidManifest.xml (minimal)
        snippet: |
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="$1"
                  android:theme="@style/Theme.Material3.DayNight">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>

  # ---------------------------------------------------------------- Gradle
  - id: gradle
    extensions: [".gradle"]
    comment: { line: "//", blockStart: "/*", blockEnd: "*/" }
    strings: ["\"", "'"]
    keywords: [
      plugins, id, apply, android, dependencies, implementation, testImplementation,
      androidTestImplementation, api, compileOnly, runtimeOnly, buildTypes, release,
      debug, defaultConfig, compileSdk, minSdk, targetSdk, applicationId, versionCode,
      versionName, namespace, kotlinOptions, jvmTarget, compileOptions, sourceCompatibility,
      targetCompatibility, buildFeatures, viewBinding, dataBinding, compose, repositories,
      google, mavenCentral, task, ext, allprojects, subprojects, minifyEnabled,
      proguardFiles
    ]
    types: []
    formatter: { indent: 4, trimTrailingWhitespace: true, insertFinalNewline: true }
    completions:
      - { label: dependencies, detail: dependencies block, insert: "dependencies {\n    implementation(\"$1\")\n}" }
      - { label: android, detail: android block, insert: "android {\n    namespace \"$1\"\n    compileSdk 34\n\n    defaultConfig {\n        applicationId \"$2\"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n    $0\n}" }
      - { label: plugins, detail: plugins block, insert: "plugins {\n    id(\"$1\")\n}" }
      - { label: implementation, detail: implementation dependency, insert: "implementation(\"$0\")" }
      - { label: defaultConfig, detail: defaultConfig block, insert: "defaultConfig {\n    applicationId \"$1\"\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName \"1.0\"\n    $0\n}" }
    helpers:
      - title: android { } skeleton
        snippet: |
          android {
              namespace "$1"
              compileSdk 34

              defaultConfig {
                  applicationId "$2"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
      - title: dependencies { } block
        snippet: |
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              $0
          }
      # Reminders for the build/test loop, as // comments so they drop into a build script
      # without breaking it. Read, then delete.
      - title: vdevice build and test without installing
        snippet: |
          // "Add run config" offers "Run in a virtual device": it builds this module and opens
          // the APK in a Device sandbox tab. Nothing is installed and adb is never used, so it
          // works on a phone that was never paired.
          // Turn it on once: Settings -> Environment -> "Run in a virtual device".
          // By hand: ./gradlew :${1:app}:assembleDebug, then paste
          // ${1:app}/build/outputs/apk/debug/*.apk into the tab's "APK path".
          $0
      - title: adb drive JCode vDevice from a terminal
        snippet: |
          // J Code serves its own adbd, and a terminal's ANDROID_SERIAL already points at it,
          // so these need no -s and no paired phone:
          //   adb devices -l   ->   127.0.0.1:5620   device   model:JCode_vDevice
          //   adb install ${1:app}/build/outputs/apk/debug/app-debug.apk
          //   adb shell am start -n ${2:com.example.app}/.MainActivity      // opens in the tab
          //   adb shell am start -n ${2:com.example.app}/.MainActivity --windowingMode 1  // full screen
          //   adb exec-out screencap -p > shot.png
          // That daemon serves install, pm list packages, am start, screencap and getprop.
          // logcat, push/pull and uninstall are not answered.
          $0

# --- header fields merged from extension.jehm ---
shortDescription: >-
  Android XML + Gradle language support, helpers, and an Android app project template (Kotlin features via the Kotlin
  Dev Pack).
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Languages
subcategory: Android
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  ui: null
  libs: []
