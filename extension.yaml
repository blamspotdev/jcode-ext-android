id: jcode.pack.android
name: Android Dev Pack
publisher: jcode
version: 0.7.2
type: language
description: Android XML + Gradle language support, helpers, and an Android app template.

# A combined Android dev pack. Kotlin coloring/completion/formatting come from the
# required Kotlin Dev Pack (jcode.lang.kotlin); this pack adds Android XML +
# Gradle languages and declares an Android app project template.
requires:
  # The Kotlin Dev Pack requires the Kotlin LSP itself, so Android gets it transitively.
  extensions: [jcode.lang.kotlin]
suggests:
  # adb is the distro's native aarch64 client. The device sandbox itself needs nothing
  # installed, but J Code's own adbd is only reachable from a terminal through it.
  sdks: [android-sdk, adb]
  dbg: [java-debug]

# Build helpers, so a project that was cloned rather than scaffolded here is one tap from an APK.
#
# All of them are `kind: build`, which puts them in the Run panel's Build segment: each produces an
# artifact (or a report) and exits, rather than starting something to interact with. None launch the
# app, deliberately. J Code detects a Gradle project's Android application modules itself and offers
# "Run on a device" and "Run in a virtual device" per module, and extension presets share that one
# list — a launch preset here would sit beside them as a duplicate, and could not be a correct one
# either: the virtual-device recipe is found afterwards by a project-RELATIVE marker in its script,
# while a preset's substitutions ({{projectDir}}, {{file}}/{{dir}}, {{fileN}}/{{dirN}}) all expand to
# guest-absolute paths. The build tasks have neither problem, and {{projectDir}} is all they need.
contributes:
  runConfigPresets:
    - android-doctor
    - android-doctor-fix
    - android-assemble-release
    - android-bundle-release
    - android-install-debug
    - android-unit-tests
    - android-lint
    - android-clean
templates:
  - android-app

languages:
  - android-xml
  - gradle
# --- header fields merged from extension.jehm ---
shortDescription: >-
  Android XML + Gradle language support, helpers, and an Android app project template (Kotlin features via the Kotlin
  Dev Pack).
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Languages
subcategory: Android
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
settings:
  - key: openLayoutsInDesigner
    label: Open layouts in the designer
    type: boolean
    default: "true"
    description: >-
      Opening a file from res/layout shows the visual designer instead of the XML. Turn this off to
      open layouts as text; the < > and Preview toggles still switch between the two either way.

entry:
  manifest: extension.yaml
  ui: null
  libs: []
  # The layout designer. Loaded on demand, in JCode's own process, and only when a file it claims is
  # opened in preview — see designer/ for what it is and NativeExtensionLoader for how it gets in.
  native:
    # A bare dex, not an APK: the designer resolves no resources — it parses layout XML itself and
    # builds views in code — so there was no resource table for JCode to attach, only an archive
    # carrying an empty one.
    dex: lib/designer.dex
    class: dev.jcode.ext.android.designer.DesignerExtension
    abi: 5
    claims:
      # A layout is decided by where it lives: AndroidManifest.xml is also XML and is not a layout.
      #
      # `opensInPreview` names the setting that governs it: a layout file *is* a layout before it is
      # XML, so opening it as text and making the user find a menu is the wrong way round. Only this
      # claim declares it — a Kotlin file is not primarily a composable, and a Dart or JSX file is
      # mostly not UI at all.
      - fileTypes: [xml]
        pathContains: res/layout
        opensInPreview: openLayoutsInDesigner
        label: Show Designer
        icon: image
      # A composable cannot be told from any other Kotlin file by its path, so ask the file.
      - fileTypes: [kt]
        contains: "@Composable"
        label: Show Designer
        icon: image
      # Flutter and React Native, drawn as an approximation and labelled as one: there is no Dart
      # or JS runtime in JCode's process, so the canvas shows structure rather than a guess at
      # pixels. Both are decided by content for the same reason Kotlin is.
      - fileTypes: [dart]
        contains: "Widget build("
        label: Show Designer
        icon: image
      - fileTypes: [jsx, tsx]
        contains: "return"
        label: Show Designer
        icon: image
