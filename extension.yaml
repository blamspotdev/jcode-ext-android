    helpers:
      - title: android { } skeleton
        snippet: |
          android {
              namespace "$1"
              compileSdk 34

              defaultConfig {
                  applicationId "$2"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
      - title: dependencies { } block
        snippet: |
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              $0
          }
      # Reminders for the build/test loop, as // comments so they drop into a build script
      # without breaking it. Read, then delete.
      - title: vdevice build and test without installing
        snippet: |
          // "Add run config" offers "Run in a virtual device": it builds this module and opens
          // the APK in a Device sandbox tab. Nothing is installed and adb is never used, so it
          // works on a phone that was never paired.
          // Turn it on once: Settings -> Environment -> "Run in a virtual device".
          // By hand: ./gradlew :${1:app}:assembleDebug, then paste
          // ${1:app}/build/outputs/apk/debug/*.apk into the tab's "APK path".
          $0
      - title: adb drive JCode vDevice from a terminal
        snippet: |
          // J Code serves its own adbd, and a terminal's ANDROID_SERIAL already points at it,
          // so these need no -s and no paired phone:
          //   adb devices -l   ->   127.0.0.1:5620   device   model:JCode_vDevice
          //   adb install ${1:app}/build/outputs/apk/debug/app-debug.apk
          //   adb shell am start -n ${2:com.example.app}/.MainActivity      // opens in the tab
          //   adb shell am start -n ${2:com.example.app}/.MainActivity --windowingMode 1  // full screen
          //   adb exec-out screencap -p > shot.png
          // That daemon serves install, pm list packages, am start, screencap and getprop.
          // logcat, push/pull and uninstall are not answered.
          $0

# --- header fields merged from extension.jehm ---
shortDescription: >-
  Android XML + Gradle language support, helpers, and an Android app project template (Kotlin features via the Kotlin
  Dev Pack).
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Languages
subcategory: Android
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
settings:
  - key: openLayoutsInDesigner
    label: Open layouts in the designer
    type: boolean
    default: "true"
    description: >-
      Opening a file from res/layout shows the visual designer instead of the XML. Turn this off to
      open layouts as text; the < > and Preview toggles still switch between the two either way.

entry:
  manifest: extension.yaml
  ui: null
  libs: []
  # The layout designer. Loaded on demand, in JCode's own process, and only when a file it claims is
  # opened in preview — see designer/ for what it is and NativeExtensionLoader for how it gets in.
  native:
    apk: lib/designer.apk
    class: dev.jcode.ext.android.designer.DesignerExtension
    abi: 2
    claims:
      # A layout is decided by where it lives: AndroidManifest.xml is also XML and is not a layout.
      #
      # `opensInPreview` names the setting that governs it: a layout file *is* a layout before it is
      # XML, so opening it as text and making the user find a menu is the wrong way round. Only this
      # claim declares it — a Kotlin file is not primarily a composable, and a Dart or JSX file is
      # mostly not UI at all.
      - fileTypes: [xml]
        pathContains: res/layout
        opensInPreview: openLayoutsInDesigner
        label: Show Designer
        icon: image
      # A composable cannot be told from any other Kotlin file by its path, so ask the file.
      - fileTypes: [kt]
        contains: "@Composable"
        label: Show Designer
        icon: image
      # Flutter and React Native, drawn as an approximation and labelled as one: there is no Dart
      # or JS runtime in JCode's process, so the canvas shows structure rather than a guess at
      # pixels. Both are decided by content for the same reason Kotlin is.
      - fileTypes: [dart]
        contains: "Widget build("
        label: Show Designer
        icon: image
      - fileTypes: [jsx, tsx]
        contains: "return"
        label: Show Designer
        icon: image
