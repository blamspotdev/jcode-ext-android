id: android-app
name: Android App
description: A minimal Kotlin Android app — Gradle build, an :app module, and a ConstraintLayout screen. Needs the Android SDK prerequisites to build.
requires:
  - android-prereqs
  - android-sdk
inputs:
  - id: minSdk
    label: Minimum SDK
    type: select
    options: ["21", "23", "24", "26", "28", "29", "30", "31", "33", "34"]
    default: "24"
  # Capped at 34: the distro's ARM-native aapt2 (Debian android-sdk-build-tools) cannot parse the
  # compact resource-table format that android.jar uses from API 35 on, so on-device resource
  # linking fails above 34.
  - id: targetSdk
    label: Target / Compile SDK
    type: select
    options: ["30", "31", "33", "34"]
    default: "34"
recipe:
  - label: Create project layout
    script: create-project-layout.sh
  - label: Write settings.gradle.kts
    script: write-settings-gradle-kts.sh
  - label: Write root build.gradle.kts
    script: write-root-build-gradle-kts.sh
  - label: Write gradle.properties
    script: write-gradle-properties.sh
  - label: Write app/build.gradle.kts
    script: write-app-build-gradle-kts.sh
  - label: Write AndroidManifest.xml
    script: write-androidmanifest-xml.sh
  - label: Write MainActivity.kt
    script: write-mainactivity-kt.sh
  - label: Write res/layout/activity_main.xml
    script: write-res-layout-activity-main-xml.sh
  - label: Write res/values/strings.xml
    script: write-res-values-strings-xml.sh
  - label: Configure Build & Run
    script: configure-build-run.sh