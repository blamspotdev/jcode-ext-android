id: android-app
name: Android App
description: An Empty Activity Compose app, scaffolded from the Android SDK's own project template — Compose, Navigation, a ViewModel and a test. Needs the Android SDK and its "Android Project Templates" package.
requires:
  - android-prereqs
  - android-sdk
inputs:
  - id: applicationId
    label: Application ID (package name)
    type: text
    default: com.example.app
  - id: minSdk
    label: Minimum SDK
    type: select
    options: ["21", "23", "24", "26", "28", "29", "30", "31", "33", "34"]
    default: "24"
# Compile SDK is deliberately not a choice any more. It is whatever this device's aapt2 can actually
# read, which the Android SDK install works out and records in jcode-compile-sdk.txt — a higher one
# scaffolds perfectly and then fails every build inside resource linking, which is a bad way to find
# out. The old dropdown offered 30/31/33/34 and did not list the platform that was installed.
recipe:
  - label: Scaffold from the Android SDK's template
    script: scaffold-from-sdk-template.sh
  - label: Configure Build & Run
    script: configure-build-run.sh
